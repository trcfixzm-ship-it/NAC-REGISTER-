<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New Apostolic Church Choir Register</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f4f6fb;--card:#ffffff;--text:#1b2233;--muted:#5d667a;--accent:#1f3864;--accent-text:#ffffff;
  --border:#c9cfdd;--band:#f2f5fa;--danger:#b3261e;--ok:#1e7a46;
  color-scheme:light dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#12151d;--card:#1b2030;--text:#eef0f6;--muted:#a3aabd;--accent:#8fb0ff;--accent-text:#0d1426;--border:#2e354a;--band:#202638;--danger:#ff8a80;--ok:#6fd49b}
}
:root[data-theme="dark"]{--bg:#12151d;--card:#1b2030;--text:#eef0f6;--muted:#a3aabd;--accent:#8fb0ff;--accent-text:#0d1426;--border:#2e354a;--band:#202638;--danger:#ff8a80;--ok:#6fd49b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.4}
main{max-width:760px;margin:0 auto;padding:16px}
header.top{text-align:center;margin:8px 0 16px;padding-bottom:12px;border-bottom:3px double var(--accent)}
h1{font-size:1.25rem;color:var(--accent);margin:0 0 4px;letter-spacing:.04em}
.sub{color:var(--muted);font-size:.85rem;margin:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.card.form{max-width:560px;margin-left:auto;margin-right:auto}
label{display:block;font-weight:bold;font-size:.9rem;margin:12px 0 4px}
label:first-child{margin-top:0}
input[type=text],input[type=password]{width:100%;padding:12px;font-size:1rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.voices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.voices button{padding:12px 4px;font-size:.95rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-family:inherit}
.voices button[aria-pressed=true]{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:bold}
.primary{width:100%;margin-top:16px;padding:14px;font-size:1rem;font-weight:bold;border:0;border-radius:8px;background:var(--accent);color:var(--accent-text);cursor:pointer;font-family:inherit}
.primary:disabled{opacity:.6}
.msg{margin:10px 0 0;font-size:.9rem;min-height:1.2em}
.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.listhead h2{margin:0;font-size:1.05rem;color:var(--accent)}
.total{font-size:.85rem;color:var(--muted)}
.tools{display:none;gap:8px}
.tools button{padding:10px 14px;border:1px solid var(--accent);border-radius:8px;background:transparent;color:var(--accent);font-weight:bold;font-size:.9rem;cursor:pointer;font-family:inherit}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{background:var(--accent);color:var(--accent-text);padding:10px 6px;text-align:left;border:1px solid var(--accent)}
td{padding:9px 6px;border:1px solid var(--border);vertical-align:middle;overflow-wrap:anywhere}
tbody tr:nth-child(even){background:var(--band)}
td.n,th.n{width:2.6em;text-align:center}
td.v,th.v{white-space:nowrap}
.del{border:0;background:transparent;color:var(--danger);font-size:1.05rem;cursor:pointer;padding:2px 6px}
.empty{text-align:center;color:var(--muted);padding:12px 0}
.printhead,.printfoot{display:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.show{display:flex}
.dialog{background:var(--card);color:var(--text);border-radius:12px;padding:20px;width:100%;max-width:340px;border:1px solid var(--border)}
.dialog h4{margin:0 0 4px;font-size:1.05rem}
.dialog p{margin:0 0 12px;font-size:.85rem;color:var(--muted)}
.dialog .msg{margin:6px 0 0}
.dialog .row{display:flex;gap:8px;margin-top:12px}
.dialog .row button{flex:1;padding:12px;border-radius:8px;font-weight:bold;font-size:.95rem;cursor:pointer;font-family:inherit}
.btn-go{background:var(--accent);color:var(--accent-text);border:0}
.btn-cancel{background:transparent;color:var(--text);border:1px solid var(--border)}
body.admin .tools{display:flex}
.delcol{display:none}
body.admin .delcol{display:table-cell}
body.admin #formCard{display:none}
.stats{display:none;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
body.admin .stats{display:grid}
.stat{border:1px solid var(--border);border-radius:8px;padding:8px 2px;text-align:center;font-size:.72rem;color:var(--muted);background:var(--bg)}
.stat b{display:block;font-size:1.2rem;color:var(--text)}
.linkbtn{display:block;margin:0 auto 24px;background:transparent;border:0;color:var(--muted);font-size:.85rem;text-decoration:underline;cursor:pointer;font-family:inherit;padding:8px}
#logoutBtn{display:none;margin:0 auto 12px}
body.admin #logoutBtn{display:block}
body.admin #adminBtn{display:none}
@media print{
  :root,:root[data-theme="dark"]{--bg:#fff;--card:#fff;--text:#000;--muted:#333;--accent:#1f3864;--accent-text:#fff;--border:#888;--band:#f0f0f0}
  body{background:#fff;color:#000;font-size:11pt}
  main{max-width:none;padding:0}
  .noprint{display:none!important}
  .card{border:0;padding:0;margin:0}
  .printhead{display:block;text-align:center;margin-bottom:10px;padding-bottom:6px;border-bottom:3px double #1f3864}
  .printhead h2{margin:0;font-size:17pt;color:#1f3864;letter-spacing:.04em}
  .printhead p{margin:3px 0 0;font-size:10pt}
  th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tbody tr:nth-child(even){-webkit-print-color-adjust:exact;print-color-adjust:exact}
  thead{display:table-header-group}
  tr{break-inside:avoid}
  .delcol{display:none!important}
  .printfoot{display:block;margin-top:10px;font-size:9pt;color:#333;text-align:right}
  @page{size:A4 portrait;margin:14mm}
}
</style>
</head>
<body>
<main>
  <header class="top noprint">
    <h1>NEW APOSTOLIC CHURCH CHOIR REGISTER</h1>
    <p class="sub" id="sub">Register below and your name is added to the choir list.</p>
  </header>
  <button class="linkbtn noprint" id="logoutBtn" type="button">Log out of admin dashboard</button>

  <section class="card form noprint" id="formCard">
    <label for="name">Full name</label>
    <input type="text" id="name" autocomplete="name" maxlength="80" placeholder="e.g. Mary Johnson">
    <label for="cong">Congregation</label>
    <input type="text" id="cong" maxlength="80" placeholder="e.g. Johannesburg Central">
    <label>Voice part</label>
    <div class="voices" id="voices"></div>
    <button class="primary" id="submit">Register</button>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <section class="card" id="listCard">
    <div class="printhead">
      <h2>NEW APOSTOLIC CHURCH CHOIR REGISTER</h2>
      <p id="printMeta"></p>
    </div>
    <div class="stats noprint" id="stats"></div>
    <div class="listhead noprint">
      <div><h2>Register</h2><span class="total" id="total"></span></div>
      <div class="tools">
        <button id="printBtn">Print</button>
        <button id="pdfBtn">Download PDF</button>
      </div>
    </div>
    <p class="msg noprint" id="toolMsg" role="status"></p>
    <div class="wrap">
      <table>
        <thead><tr><th class="n">No.</th><th>Name</th><th>Congregation</th><th class="v">Voice Part</th><th class="delcol noprint"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="empty" id="empty">Loading the list…</p>
    <p class="printfoot" id="printFoot"></p>
  </section>
  <button class="linkbtn noprint" id="adminBtn" type="button">Admin login</button>
</main>

<div class="overlay" id="pwOverlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
    <h4 id="pwTitle">Admin login</h4>
    <p>Enter the admin password to open the dashboard.</p>
    <input type="password" id="pw" autocomplete="off" placeholder="Password">
    <p class="msg err" id="pwMsg" role="alert"></p>
    <div class="row"><button class="btn-cancel" id="pwCancel" type="button">Cancel</button><button class="btn-go" id="pwGo" type="button">Log in</button></div>
  </div>
</div>

<script>
(function(){
  var VOICES=["Soprano","Alto","Tenor","Bass"];
  var HASH="TkFDMjAyNg==";
  var ADMIN_PASSWORD="NAC2026";
  var rows=[],voice=null,col=null,admin=false,loaded=false;
  var $=function(id){return document.getElementById(id)};

  // Replace this with your Firebase project config.
  // If left blank, it falls back to local browser storage.
  window.FIREBASE_CONFIG = window.FIREBASE_CONFIG || {
    apiKey: "",
    authDomain: "",
    projectId: "",
    storageBucket: "",
    messagingSenderId: "",
    appId: ""
  };

  function say(t,cls){var m=$("msg");m.textContent=t||"";m.className="msg"+(cls?" "+cls:"")}
  function toolSay(t,cls){var m=$("toolMsg");m.textContent=t||"";m.className="msg noprint"+(cls?" "+cls:"")}
  function dateStr(){return new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}
  function hasFirebaseConfig(){
    var c=window.FIREBASE_CONFIG||{};
    return Boolean(c.projectId && c.apiKey && c.appId);
  }

  VOICES.forEach(function(v){
    var b=document.createElement("button");b.type="button";b.textContent=v;b.setAttribute("aria-pressed","false");
    b.onclick=function(){voice=v;[].forEach.call($("voices").children,function(x){x.setAttribute("aria-pressed",String(x===b))})};
    $("voices").appendChild(b);
  });

  function sortedAll(){
    return rows.slice().sort(function(a,b){
      var d=VOICES.indexOf(a.voice)-VOICES.indexOf(b.voice);
      return d||a.name.toLowerCase().localeCompare(b.name.toLowerCase());
    });
  }
  function summary(){
    return "Total: "+rows.length+"   |   "+VOICES.map(function(v){return v+": "+rows.filter(function(r){return r.voice===v}).length}).join("   |   ");
  }

  function render(){
    var tb=$("rows");tb.textContent="";
    sortedAll().forEach(function(r,i){
      var tr=document.createElement("tr");
      [i+1,r.name,r.congregation,r.voice].forEach(function(t,k){
        var td=document.createElement("td");
        if(k===0)td.className="n";if(k===3)td.className="v";
        td.textContent=t;tr.appendChild(td);
      });
      var dt=document.createElement("td");dt.className="delcol noprint";
      if(admin){
        var d=document.createElement("button");d.type="button";d.className="del";d.textContent="✕";d.setAttribute("aria-label","Remove "+r.name);
        d.onclick=function(){if(confirm("Remove "+r.name+" from the register?")){if(col&&col.doc){col.doc(r.id).delete().catch(function(){say("Could not remove that entry.","err")})}}};
        dt.appendChild(d);
      }
      tr.appendChild(dt);tb.appendChild(tr);
    });
    var e=$("empty");
    if(!loaded){e.style.display="";e.textContent="Loading the list…"}
    else if(!rows.length){e.style.display="";e.textContent="No one registered yet."}
    else e.style.display="none";
    document.body.classList.toggle("admin",admin);
    $("sub").textContent=admin?"ADMIN DASHBOARD":"Register below and your name is added to the choir list.";
    var st=$("stats");st.textContent="";
    [["Total",rows.length]].concat(VOICES.map(function(v){return [v,rows.filter(function(r){return r.voice===v}).length]})).forEach(function(p){
      var d=document.createElement("div");d.className="stat";var b=document.createElement("b");b.textContent=p[1];d.appendChild(b);d.appendChild(document.createTextNode(p[0]));st.appendChild(d);
    });
    $("total").textContent=rows.length+(rows.length===1?" member registered":" members registered");
    $("printMeta").textContent=summary();
    $("printFoot").textContent="Printed "+dateStr();
  }

  $("submit").onclick=function(){
    var name=$("name").value.trim().replace(/\s+/g," "),cong=$("cong").value.trim().replace(/\s+/g," ");
    if(!name){say("Please enter your name.","err");return}
    if(!cong){say("Please enter your congregation.","err");return}
    if(!voice){say("Please choose your voice part.","err");return}
    if(!col){say("Registration is not available right now. Ask the choir leader to give you access.","err");return}
    var dup=rows.some(function(r){return r.name.toLowerCase()===name.toLowerCase()&&r.congregation.toLowerCase()===cong.toLowerCase()&&r.voice===voice});
    if(dup){say("You are already on the list.","err");return}
    var btn=$("submit");btn.disabled=true;say("Saving…");
    col.add({name:name,congregation:cong,voice:voice,created:Date.now()}).then(function(){
      say("Thank you, "+name+"! You are registered as "+voice+".","ok");
      $("name").value="";voice=null;
      [].forEach.call($("voices").children,function(x){x.setAttribute("aria-pressed","false")});
    }).catch(function(){say("Could not save. Please check your connection and access, then try again.","err")}).then(function(){btn.disabled=false});
  };

  function closePw(){$("pwOverlay").classList.remove("show");$("pw").value="";$("pwMsg").textContent=""}
  function gate(a){a()}
  function setAdmin(on){admin=on;toolSay("");render();window.scrollTo(0,0)}
  function checkPassword(value){
    var entered=(value||"").trim();
    if(!entered)return false;
    return btoa(entered)===HASH || entered===ADMIN_PASSWORD;
  }
  function tryUnlock(){
    if(checkPassword($("pw").value)){closePw();setAdmin(true)}
    else{$("pwMsg").textContent="Incorrect password.";$("pw").select()}
  }
  $("adminBtn").onclick=function(){$("pwOverlay").classList.add("show");setTimeout(function(){$("pw").focus()},50)};
  $("logoutBtn").onclick=function(){setAdmin(false)};
  $("pwGo").onclick=tryUnlock;
  $("pwCancel").onclick=closePw;
  $("pw").onkeydown=function(e){if(e.key==="Enter")tryUnlock();if(e.key==="Escape")closePw()};

  $("printBtn").onclick=function(){gate(function(){try{window.print()}catch(e){toolSay("Use your browser menu to print.","err")}})};

  function buildPdf(){
    var J=window.jspdf&&window.jspdf.jsPDF;if(!J)return null;
    var doc=new J({unit:"mm",format:"a4"});
    var W=210,H=297,M=15,widths=[14,66,66,34],list=sortedAll();
    function header(first){
      var y=M;
      if(first){
        doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(31,56,100);
        doc.text("NEW APOSTOLIC CHURCH CHOIR REGISTER",W/2,y+6,{align:"center"});
        doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(60,60,60);
        doc.text(summary(),W/2,y+13,{align:"center"});
        doc.text("Date: "+dateStr(),W/2,y+18.5,{align:"center"});
        doc.setDrawColor(31,56,100);doc.setLineWidth(0.6);doc.line(M,y+22,W-M,y+22);doc.setLineWidth(0.2);
        y+=27;
      }
      var x=M;
      doc.setFillColor(31,56,100);doc.setDrawColor(31,56,100);
      doc.rect(M,y,W-2*M,8,"F");
      doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(255,255,255);
      ["No.","Name","Congregation","Voice Part"].forEach(function(t,i){
        if(i===0)doc.text(t,x+widths[i]/2,y+5.4,{align:"center"});else doc.text(t,x+2,y+5.4);
        x+=widths[i];
      });
      return y+8;
    }
    var y=header(true);
    doc.setFont("helvetica","normal");doc.setFontSize(10);
    list.forEach(function(r,i){
      var nameL=doc.splitTextToSize(r.name,widths[1]-4),congL=doc.splitTextToSize(r.congregation,widths[2]-4);
      var lines=Math.max(nameL.length,congL.length,1),h=Math.max(8,lines*4.6+3.4);
      if(y+h>H-20){doc.addPage();y=header(false);doc.setFont("helvetica","normal");doc.setFontSize(10)}
      var x=M;
      doc.setDrawColor(140,140,140);doc.setLineWidth(0.2);
      for(var c=0;c<4;c++){
        if(i%2===1){doc.setFillColor(242,245,250);doc.rect(x,y,widths[c],h,"FD")}else doc.rect(x,y,widths[c],h);
        x+=widths[c];
      }
      doc.setTextColor(0,0,0);
      doc.text(String(i+1),M+widths[0]/2,y+5.4,{align:"center"});
      doc.text(nameL,M+widths[0]+2,y+5.4);
      doc.text(congL,M+widths[0]+widths[1]+2,y+5.4);
      doc.text(r.voice,M+widths[0]+widths[1]+widths[2]+2,y+5.4);
      y+=h;
    });
    if(!list.length){doc.setTextColor(90,90,90);doc.text("No members registered yet.",W/2,y+10,{align:"center"})}
    var n=doc.getNumberOfPages();
    for(var p=1;p<=n;p++){
      doc.setPage(p);doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(100,100,100);
      doc.text("New Apostolic Church Choir Register",M,H-10);
      doc.text("Page "+p+" of "+n,W-M,H-10,{align:"right"});
    }
    return doc;
  }

  $("pdfBtn").onclick=function(){gate(async function(){
    var doc;
    try{doc=buildPdf()}catch(e){doc=null}
    if(!doc){toolSay("The PDF tool could not load. Use Print and choose Save as PDF instead.","err");return}
    toolSay("Preparing PDF…");
    if(typeof claude==="undefined"){
      try{doc.save("NAC_Choir_Register.pdf");toolSay("PDF ready.","ok")}catch(e){toolSay("Could not download. Use Print and choose Save as PDF instead.","err")}
      return;
    }
    try{
      var dl=await claude.use("downloads");
      if(!dl){toolSay("Saving is not available here. Use Print and choose Save as PDF instead.","err");return}
      await dl.save({filename:"NAC_Choir_Register.pdf",data:doc.output("arraybuffer")});
      toolSay("PDF ready.","ok");
    }catch(e){
      if(e&&e.code==="declined")toolSay("Download cancelled.");
      else if(e&&e.code==="rate_limited")toolSay("Please wait a moment and tap Download PDF again.","err");
      else toolSay("Could not download. Use Print and choose Save as PDF instead.","err");
    }
  })};

  function localMode(){
    var KEY="nac_choir_register",store=[];
    try{store=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){store=[]}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}rows=store.slice();render()}
    loaded=true;
    col={add:function(d){d.id="r"+Date.now()+Math.floor(Math.random()*1000);store.push(d);save();return Promise.resolve()},
         doc:function(id){return {delete:function(){store=store.filter(function(x){return x.id!==id});save();return Promise.resolve()}}}};
    rows=store.slice();render();
  }

  function firebaseMode(){
    if(!hasFirebaseConfig()){
      localMode();
      return;
    }
    try{
      if(!window.firebase || !window.firebase.firestore){
        throw new Error("Firebase Firestore is not loaded.");
      }
      if(!firebase.apps.length){
        firebase.initializeApp(window.FIREBASE_CONFIG);
      }
      col=firebase.firestore().collection("registrations");
      col.onSnapshot(function(snap){
        loaded=true;
        rows=snap.docs.map(function(d){var x=d.data()||{};return {id:d.id,name:String(x.name||""),congregation:String(x.congregation||""),voice:String(x.voice||"")}});
        render();
      },function(){
        loaded=true;render();$("empty").style.display="";$("empty").textContent="The list could not be loaded.";
      });
    }catch(e){
      localMode();
    }
  }

  (async function(){
    if(typeof claude!=="undefined"){
      var timer=setTimeout(function(){if(!loaded){$("empty").textContent="Cannot reach the list yet. Check your connection or access."}},10000);
      try{
        var db=await claude.use("db");
        if(!db){clearTimeout(timer);firebaseMode();return}
        col=db.collection("registrations");
        col.onSnapshot(function(snap){
          clearTimeout(timer);loaded=true;
          rows=snap.docs.map(function(d){var x=d.data()||{};return {id:d.id,name:String(x.name||""),congregation:String(x.congregation||""),voice:String(x.voice||"")}});
          render();
        },function(){clearTimeout(timer);loaded=true;render();$("empty").style.display="";$("empty").textContent="The list could not be loaded."});
      }catch(e){clearTimeout(timer);firebaseMode();}
      return;
    }
    firebaseMode();
  })();
  render();
})();
</script>
</body>
</html>
